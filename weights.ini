; ---------------------------------------------------------------------------
; weights.ini -- score weights and scoring policy for shortlist.py
;
; Edit the numbers; no code changes needed. The program refuses to run if a
; weight is missing, non-numeric, negative, or the weights do not add up to 100.
; Expense ratio is intentionally not a scoring parameter.
; ---------------------------------------------------------------------------

[meta]
; Bump this when you change weights; it is printed in every report.
version = 2

; renormalize_available : a fund's score is the weighted average over the metrics
;                         it HAS (weights rescaled to 100%). Funds whose measured
;                         weight is below minimum_coverage_percent are NOT ranked
;                         (status INSUFFICIENT_DATA).
; average               : a missing metric counts as an average score (the old behaviour;
;                          set minimum_coverage_percent = 0 as well to rank every fund, as before).
missing_data_policy = renormalize_available

; Share of the total weight that must be measurable before a fund gets a rank
; (applies to both policies; 0 = never leave a fund unranked).
minimum_coverage_percent = 70

; zscore     : metrics are standardised across the funds being ranked (old behaviour)
; percentile : metrics become percentile ranks (0-100) among the funds being ranked
scoring_method = percentile

; A ranking built on fewer funds than this is flagged LOW CONFIDENCE.
min_group_size = 8

[weights_percent]
; Metric                      Weight %      (higher is better unless noted)
cagr_1y                    = 5
cagr_3y                    = 10
cagr_5y                    = 15
risk_return_ratio          = 5      ; Sharpe-style
sortino_ratio              = 5
rolling_positive_pct       = 10      ; share of rolling windows (3y; or 5y, see config.ROLLING_WINDOW_YEARS) with a positive return
sip_xirr                   = 5
max_drawdown               = 10     ; smaller loss is better
benchmark_excess_return    = 10
rolling_beat_benchmark_pct = 10
portfolio_quality          = 5
; New metrics, off by default (0). Give them weight by taking it from another line
; so the total stays 100.
downside_capture           = 0      ; LOWER is better (losses relative to the benchmark in down months)
quartile_consistency       = 0      ; share of rolling windows spent in the top half of the peer group
; Added later, also off by default. Both are measured against the category benchmark over the last
; 3 years of month-end returns (config.ALPHA_BETA_YEARS):
jensen_alpha               = 5      ; annual return the fund added beyond what its beta to the benchmark explains (higher is better)
beta                       = 5      ; sensitivity to the benchmark; LOWER is scored better. A low beta can also mean a lot of cash, so use with care
